apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Release signing. The keystore and its passwords live outside the repo:
 * set these four as Gradle properties (~/.gradle/gradle.properties, or -P on
 * the command line) or as environment variables of the same name.
 *
 *   PINPOINTER_RELEASE_STORE_FILE      path to the keystore (.jks / .keystore)
 *   PINPOINTER_RELEASE_STORE_PASSWORD
 *   PINPOINTER_RELEASE_KEY_ALIAS
 *   PINPOINTER_RELEASE_KEY_PASSWORD
 *
 * Without them a release build is signed with the debug key, which is fine
 * for trying a build on your own phone and nothing else.
 */
def releaseSigning = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()
}
def releaseStoreFile = releaseSigning('PINPOINTER_RELEASE_STORE_FILE')

/**
 * sherpa-onnx (voice search) comes as an AAR in libs/, fetched by `npm install`
 * (download-models.js). It carries its own libonnxruntime.so, but the app
 * already gets ONNX Runtime from onnxruntime-android (see dependencies), and
 * an APK can hold only one. The app therefore links a copy of the AAR without
 * that file, so the one in the APK is always onnxruntime-android's (the one
 * with XNNPACK, which MobileCLIPModule asks for).
 *
 * The two must be built for the SAME ONNX Runtime version: each library asks
 * for libonnxruntime.so by exact version tag, and a mismatch builds fine but
 * leaves voice search or photo search unable to load on the phone. The pair
 * is checked by __tests__/nativeLibraries.test.js.
 */
def sherpaAars = fileTree(dir: 'libs', include: ['sherpa-onnx-*.aar'])
def slimSherpaAar = tasks.register('slimSherpaAar', Zip) {
    description = 'Copies the sherpa-onnx AAR without its bundled libonnxruntime.so.'
    doFirst {
        if (sherpaAars.files.size() != 1) {
            throw new GradleException(
                "Expected exactly one sherpa-onnx AAR in android/app/libs, found ${sherpaAars.files.size()}. " +
                "Run `npm install` (it runs download-models.js).")
        }
    }
    from({ sherpaAars.files.collect { zipTree(it) } }) {
        exclude 'jni/*/libonnxruntime.so'
    }
    archiveFileName = 'sherpa-onnx-slim.aar'
    destinationDirectory = layout.buildDirectory.dir('sherpa-onnx')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.pinpointer.app"

    // Don't compress model files — allows memory-mapping from APK
    // NOTE: aaptOptions is deprecated in AGP 8+; androidResources is the replacement
    aaptOptions {
        noCompress "onnx", "bin", "txt"
    }
    androidResources {
        noCompress += ["onnx", "bin", "txt", "ort"]
    }

    defaultConfig {
        applicationId "com.pinpointer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64", "x86", "armeabi-v7a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseSigning('PINPOINTER_RELEASE_STORE_PASSWORD')
                keyAlias releaseSigning('PINPOINTER_RELEASE_KEY_ALIAS')
                keyPassword releaseSigning('PINPOINTER_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with your own keystore when one is configured (see the
            // top of this file), otherwise with the debug key.
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Handle duplicate native libraries from different sources.
    // libonnxruntime.so is deliberately NOT here: there must be exactly one
    // (see slimSherpaAar above), and a second copy should fail the build
    // instead of being picked at random.
    packagingOptions {
        pickFirsts = [
            "**/libc++_shared.so",
            "**/libjsi.so",
            "**/libfbjni.so",
            "**/libfolly_runtime.so",
            "**/libreactnative.so"
        ]
    }
}

configurations.all {
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-core-utils'
    exclude group: 'com.android.support', module: 'support-core-ui'
    exclude group: 'com.android.support', module: 'support-fragment'
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.android.support', module: 'versionedparcelable'
    exclude group: 'com.android.support', module: 'animated-vector-drawable'
    exclude group: 'com.android.support', module: 'support-vector-drawable'
}

dependencies {
    // 1. The "Latin" model (for English and Numbers)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // 2. The "Devanagari" model (for Hindi)
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'

    // 3. ONNX Runtime Android - Java/Kotlin API for MobileCLIP inference, and
    // the one libonnxruntime.so in the APK. The version must be the ONNX
    // Runtime that the sherpa-onnx AAR is built against (download-models.js).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'

    // 4. sherpa-onnx for on-device speech-to-text, without its own libonnxruntime.so
    implementation files(slimSherpaAar)


    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isHermesEnabled = project.hasProperty("hermesEnabled") ? project.hermesEnabled.toBoolean() : true
    if (isHermesEnabled) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
